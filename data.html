<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DATA - Sandeep Shield</title>
<style>
body{margin:0;background:#0a1931;color:#fff;font-family:system-ui;padding:10px}
.card{background:#102542;border:1px solid #1e3a5f;padding:12px;border-radius:12px;margin:8px 0}
.btn{padding:10px;border:none;border-radius:8px;font-weight:900;cursor:pointer;flex:1}
.badge{font-size:9px;padding:3px 7px;border-radius:10px;font-weight:900}
.live{background:#f9d678;color:#000}.fraud{background:#ef4444}.safe{background:#22c55e;color:#000}.undef{background:#f9d678;color:#000}
</style>
</head>
<body>
<div style="display:flex;gap:6px">
<button class="btn" style="background:#22c55e" onclick="location.href='index.html'">🏠 HOME</button>
<button class="btn" style="background:#ef4444;color:#fff" onclick="clearData()">🗑️ CLEAR</button>
<button class="btn" style="background:#020617;color:#fff;border:1px solid #333" onclick="exportData()">📤 EXPORT</button>
</div>
<h2 style="color:#f9d678">📊 All Scans - Live Data</h2>
<div id="stats" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"></div>
<div id="list"></div>
<script>
let chain=JSON.parse(localStorage.getItem('shield_final_up_realtime')||'[]');
function render(){
 let upi=chain.filter(c=>c.cat=='upi').length;
 let crypto=chain.filter(c=>c.cat=='crypto').length;
 let social=chain.filter(c=>c.cat=='social').length;
 let undef=chain.filter(c=>c.cat=='undef').length;
 let blocked=chain.filter(c=>c.fraud).length;
 document.getElementById('stats').innerHTML=`
 <div class="card" style="text-align:center;margin:0"><b style="color:#22c55e;font-size:20px">${upi}</b><br>UPI</div>
 <div class="card" style="text-align:center;margin:0"><b style="color:#a855f7;font-size:20px">${crypto}</b><br>CHAIN</div>
 <div class="card" style="text-align:center;margin:0"><b style="color:#ec4899;font-size:20px">${social}</b><br>SOCIAL</div>
 <div class="card" style="text-align:center;margin:0;border:1px solid #f9d678"><b style="color:#f9d678;font-size:20px">${undef}</b><br>UNDEFINED</div>
 <div class="card" style="text-align:center;margin:0"><b style="color:#ef4444;font-size:20px">${blocked}</b><br>BLOCKED</div>
 <div class="card" style="text-align:center;margin:0"><b>${chain.length}</b><br>TOTAL</div>`;
 let h=""; chain.slice().reverse().forEach(b=>{ if(b.type=='HUB_GENESIS')return; h+=`<div class="card"><span class="badge live">LIVE</span> <span class="badge ${b.fraud?'fraud':b.cat}">${b.chainType}</span> <b>${b.msg}</b><br><small>Tx:${b.hash}<br>${new Date(b.time).toLocaleString()}</small></div>`;});
 document.getElementById('list').innerHTML=h||`<div class="card" style="text-align:center;color:#888">No scans yet - Go HOME</div>`;
}
function clearData(){ if(confirm('Clear?')){ let g=chain.find(c=>c.type=='HUB_GENESIS'); chain=g?[g]:[]; localStorage.setItem('shield_final_up_realtime',JSON.stringify(chain)); render();}}
function exportData(){ let blob=new Blob([JSON.stringify(chain,null,2)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='data.json'; a.click();}
render();
</script>
</body>
</html>
