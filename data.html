<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATA EXPLORER - Chain 98765</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:12px;margin:0}
.top{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.box{background:#1e293b;padding:10px 14px;border-radius:10px;flex:1;text-align:center;min-width:70px}
.box b{font-size:20px;display:block}
.card{background:#1e293b;border-left:4px solid #ef4444;border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px;line-height:1.5}
.card.safe{border-left-color:#22c55e}
.card.fraud{border-left-color:#ef4444}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{padding:6px 12px;border-radius:6px;border:0;font-size:12px;font-weight:bold;cursor:pointer}
.share{background:#25D366;color:white}
.pdf{background:#3b82f6;color:white}
.head{font-weight:bold;color:#fbbf24}
.small{color:#94a3b8;font-size:11px}
</style>
</head>
<body>

<h2 style="margin:6px 0;">📊 DATA EXPLORER - CHAIN 98765</h2>
<div class="top">
  <div class="box"><b id="total">0</b><span>TOTAL</span></div>
  <div class="box"><b id="upi">0</b><span>UPI/LINK</span></div>
  <div class="box"><b id="safe">0</b><span>SAFE</span></div>
  <div class="box"><b id="fraud">0</b><span>FRAUD</span></div>
</div>

<input id="search" placeholder="🔍 Search UPI / Tx / QKey..." style="width:100%;padding:10px;border-radius:8px;border:0;background:#1e293b;color:white;margin-bottom:12px;" onkeyup="render()">

<div id="list">Loading...</div>

<script>
function getBlocks(){
  let keys = ["sandeep_shield_blocks","shield_blocks","upi_blocks","txs","blocks","sandeepShieldData","sandeep_shield_chain"];
  for(let k of keys){
    let v = localStorage.getItem(k);
    if(v){ try{ let j=JSON.parse(v); if(Array.isArray(j) && j.length>0) return j; }catch(e){} }
  }
  return [];
}

function render(){
  let blocks = getBlocks().reverse();
  let q = document.getElementById("search").value.toLowerCase();
  let filtered = blocks.filter(b => JSON.stringify(b).toLowerCase().includes(q));
  
  document.getElementById("total").innerText = blocks.length;
  document.getElementById("upi").innerText = blocks.length;
  document.getElementById("safe").innerText = blocks.filter(b=> (b.result||"").includes("SAFE") || (b.result||"").includes("NO KNOWN") || (b.type||"").includes("SAFE")).length;
  document.getElementById("fraud").innerText = blocks.filter(b=> (b.result||"").includes("FRAUD") || (b.result||"").includes("HIGH RISK") || (b.result||"").includes("RISK")).length;

  let html = "";
  filtered.forEach(b=>{
    let isSafe = (b.result||"").includes("SAFE") || (b.result||"").includes("NO KNOWN") || (b.type+"").includes("SAFE");
    html += `<div class="card ${isSafe?'safe':'fraud'}">
      <div class="head">${isSafe?'🟢 LIVE UPI SAFE':'🔴 LIVE UPI FRAUD 95%'} - ${b.time||b.timestamp||''}</div>
      <div>${isSafe?'✅':'🚨'} <b>UPI-RISK:</b> ${b.data||b.upi||''} | ${b.message||b.result||''}</div>
      <div class="small">Data: ${b.data||b.upi||''}</div>
      <div class="small">Tx: ${b.tx||b.txId||''} | API: ${b.api||'UPI-RISK - REAL'}</div>
      <div class="small">QKey: ${b.qkey||b.qKey||''}</div>
      <div class="btns">
        <button class="btn share" onclick="shareProof('${b.tx||b.txId}','${b.data||b.upi}','${(b.message||b.result||'').replace(/'/g,'')}')">📤 Share</button>
        <button class="btn pdf" onclick="pdfProof('${b.tx||b.txId}','${b.data||b.upi}','${(b.message||b.result||'').replace(/'/g,'')}','${b.qkey||b.qKey}')">📄 PDF</button>
      </div>
    </div>`;
  });
  document.getElementById("list").innerHTML = html || "No data found";
}
function shareProof(tx,data,result){
  let text = `*Sandeep Shield Proof 98765*%0A%0A🔍 UPI: ${data}%0A📊 Result: ${result}%0A🧾 Tx: ${tx}%0A⛓️ Chain ID: 98765%0A✅ Verified by Sandeep Shield`;
  window.open(`https://wa.me/?text=${text}`,'_blank');
}
function pdfProof(tx,data,result,qkey){
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();
  doc.setFontSize(15);
  doc.text("Sandeep Shield - Chain Proof 98765",10,15);
  doc.setFontSize(11);
  doc.text(`UPI/Data: ${data}`,10,30);
  doc.text(`Result: ${result}`,10,40);
  doc.text(`Tx ID: ${tx}`,10,50);
  doc.text(`QKey: ${qkey}`,10,60);
  doc.text(`Chain: UPI-RISK | Prev: HUB-GENESIS-...98765`,10,70);
  doc.text(`Time: ${new Date().toLocaleString()}`,10,80);
  doc.text(`API: Real-Time - REAL`,10,90);
  doc.text(`Scam Intelligence by Sandeep Shield`,10,110);
  doc.save(`${tx}.pdf`);
}
render();
</script>
</body>
</html>
