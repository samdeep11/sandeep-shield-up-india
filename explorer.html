<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAIN EXPLORER - 98765</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:12px;margin:0}
.top{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.box{background:#1e293b;padding:10px 14px;border-radius:10px;flex:1;text-align:center;min-width:60px}
.box b{font-size:18px;display:block;color:#fbbf24}
.block{background:#1e293b;border:1px solid #334155;border-left:4px solid #ef4444;border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px;line-height:1.6}
.block.safe{border-left-color:#22c55e}
.block.fraud{border-left-color:#ef4444}
.badge{background:#22c55e;color:black;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:bold}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{padding:6px 12px;border-radius:6px;border:0;font-size:12px;font-weight:bold;cursor:pointer}
.share{background:#25D366;color:white}
.pdf{background:#3b82f6;color:white}
.small{color:#94a3b8;font-size:11px;word-break:break-all}
.head{font-size:15px;font-weight:bold;margin-bottom:4px}
</style>
</head>
<body>

<h2 style="margin:6px 0;">⛓️ CHAIN EXPLORER - CHAIN 98765</h2>
<div class="top">
  <div class="box"><b id="total">0</b><span>TOTAL BLOCKS</span></div>
  <div class="box"><b id="safe">0</b><span>SAFE</span></div>
  <div class="box"><b id="fraud">0</b><span>FRAUD</span></div>
  <div class="box"><b>98765</b><span>CHAIN ID</span></div>
</div>

<input id="search" placeholder="🔍 Search Block / Tx / UPI / QKey..." style="width:100%;padding:10px;border-radius:8px;border:0;background:#1e293b;color:white;margin-bottom:12px;" onkeyup="render()">

<div id="list">Loading Chain...</div>

<script>
function getBlocks(){
  let keys = ["sandeep_shield_blocks","shield_blocks","upi_blocks","txs","blocks","sandeepShieldData","sandeep_shield_chain"];
  for(let k of keys){
    let v = localStorage.getItem(k);
    if(v){ try{ let j=JSON.parse(v); if(Array.isArray(j) && j.length>0) return j; }catch(e){} }
  }
  return [];
}

function render(){
  let blocks = getBlocks();
  let q = document.getElementById("search").value.toLowerCase();
  let filtered = blocks.filter(b => JSON.stringify(b).toLowerCase().includes(q));
  
  // newest first for explorer = Block #N is latest
  filtered = filtered.reverse();
  
  document.getElementById("total").innerText = blocks.length;
  document.getElementById("safe").innerText = blocks.filter(b=> (b.result||"").includes("SAFE") || (b.result||"").includes("NO KNOWN") || (b.type+"").includes("SAFE")).length;
  document.getElementById("fraud").innerText = blocks.filter(b=> (b.result||"").includes("FRAUD") || (b.result||"").includes("HIGH RISK") || (b.result||"").includes("RISK")).length;

  let html = "";
  filtered.forEach((b, idx)=>{
    let blockNum = blocks.length - idx;
    let isSafe = (b.result||"").includes("SAFE") || (b.result||"").includes("NO KNOWN") || (b.type+"").includes("SAFE");
    html += `<div class="block ${isSafe?'safe':'fraud'}">
      <div class="head">Block #${blockNum} <span class="badge">LIVE</span></div>
      <div>${isSafe?'✅':'🚨'} <b>UPI-RISK:</b> ${b.data||b.upi||''} | ${b.message||b.result||''}</div>
      <div class="small">Tx: ${b.tx||b.txId||''}</div>
      <div class="small">Prev: HUB-GENESIS-...98765</div>
      <div class="small">Data: ${(b.data||b.upi||'').substring(0,50)}...</div>
      <div class="small">Time: ${b.time||b.timestamp||''} | API: Real-Time - REAL</div>
      <div class="small">QKey: ${b.qkey||b.qKey||''} | Chain: UPI-RISK | ${isSafe?'✅ SAFE BLOCK':'🚨 FRAUD BLOCK'}</div>
      <div class="btns">
        <button class="btn share" onclick="shareBlock('${blockNum}','${b.tx||b.txId}','${b.data||b.upi}','${(b.message||b.result||'').replace(/'/g,'')}')">📤 Share Block</button>
        <button class="btn pdf" onclick="pdfBlock('${blockNum}','${b.tx||b.txId}','${b.data||b.upi}','${(b.message||b.result||'').replace(/'/g,'')}','${b.qkey||b.qKey}')">📄 PDF Proof</button>
      </div>
    </div>`;
  });
  document.getElementById("list").innerHTML = html || "No blocks found. Scan first in HOME.";
}
function shareBlock(num, tx, data, result){
  let text = `*Sandeep Shield - Block #${num}*%0A%0A⛓️ Chain ID: 98765%0A🧱 Block: #${num}%0A🔍 UPI: ${data}%0A📊 Result: ${result}%0A🧾 Tx: ${tx}%0A🔗 Prev: HUB-GENESIS-...98765%0A✅ Verified`;
  window.open(`https://wa.me/?text=${text}`,'_blank');
}
function pdfBlock(num, tx, data, result, qkey){
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();
  doc.setFontSize(16);
  doc.text(`Block #${num} - Sandeep Shield Chain 98765`,10,15);
  doc.setFontSize(11);
  doc.text(`Block Number: ${num}`,10,30);
  doc.text(`UPI/Data: ${data}`,10,40);
  doc.text(`Result: ${result}`,10,50);
  doc.text(`Tx ID: ${tx}`,10,60);
  doc.text(`QKey: ${qkey}`,10,70);
  doc.text(`Prev Hash: HUB-GENESIS-...98765`,10,80);
  doc.text(`Chain: UPI-RISK | Chain ID: 98765`,10,90);
  doc.text(`Time: ${new Date().toLocaleString()}`,10,100);
  doc.text(`Status: ${result.includes('SAFE')?'SAFE BLOCK':'FRAUD BLOCK'}`,10,110);
  doc.text(`Scam Intelligence by Sandeep Shield`,10,125);
  doc.save(`Block-${num}-${tx}.pdf`);
}
render();
</script>
</body>
</html>
