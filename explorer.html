<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAIN - Sandeep Shield 98765</title>
<style>
body{background:#0a1930;color:#fff;font-family:Arial;margin:0;padding:12px}
.top-box{background:#132a5c;border:2px solid #facc15;border-radius:20px;padding:18px;text-align:center;margin-bottom:12px}
.top-box h1{margin:0;font-size:22px;line-height:1.2}
.top-box h1 span{color:#facc15}
.top-box p{color:#94a3b8;font-size:12px;margin:8px 0 0 0}
.nav{display:flex;gap:10px;margin-bottom:12px}
.nav a{flex:1;text-align:center;padding:12px;border-radius:14px;text-decoration:none;font-weight:bold;border:2px solid #1e3a6b;background:#112240;color:#fff}
.nav a.active{background:#22c55e;color:#000;border-color:#22c55e}
.chain-info{background:#112240;border:1px solid #1e3a6b;border-radius:18px;padding:14px;margin-bottom:14px}
.chain-info h3{color:#facc15;margin:0 0 10px 0}
.info-grid{display:flex;gap:8px}
.info{background:#0a1930;border-radius:12px;padding:10px;flex:1;text-align:center;border:1px solid #1e3a6b}
.info b{display:block;font-size:18px;color:#22c55e}
.explorer{background:#112240;border:2px solid #facc15;border-radius:20px;padding:14px}
.ex-head{color:#facc15;font-weight:bold;font-size:18px;margin-bottom:12px}
.block{background:#0a1930;border:1.5px solid #22c55e;border-radius:14px;padding:12px;margin-bottom:12px;position:relative}
.block::before{content:'';position:absolute;left:20px;top:-12px;width:2px;height:12px;background:#22c55e}
.block:first-child::before{display:none}
.b-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.b-num{background:#22c55e;color:#000;padding:4px 10px;border-radius:20px;font-weight:bold;font-size:12px}
.b-time{color:#94a3b8;font-size:11px}
.b-title{font-weight:bold;font-size:13px;margin-bottom:4px}
.b-hash{color:#94a3b8;font-size:11px;word-break:break-all}
.b-hash span{color:#facc15}
.chain-line{text-align:center;color:#22c55e;font-size:12px;margin:4px 0;letter-spacing:2px}
.verify{margin-top:8px;padding:8px;border-radius:8px;background:#052e16;border:1px solid #22c55e;font-size:11px;color:#22c55e;text-align:center}
</style>
</head>
<body>

<div class="top-box">
<h1>⛓️ CHAIN EXPLORER - <span id="c1">5</span><br><span>98765 LIVE</span></h1>
<p>Chain ID 98765 | ETH,BSC,Polygon,BTC,Tron - Real-Time | Baghpat UP</p>
</div>

<div class="nav">
<a href="index.html">🏠 HOME</a>
<a href="data.html">📊 DATA</a>
<a href="explorer.html" class="active">⛓️ CHAIN</a>
</div>

<div class="chain-info">
<h3>🔗 Block Chain Status</h3>
<div class="info-grid">
<div class="info"><b id="total">5</b>TOTAL BLOCKS</div>
<div class="info"><b style="color:#facc15">98765</b>CHAIN ID</div>
<div class="info"><b style="color:#38bdf8">LIVE</b>STATUS</div>
</div>
</div>

<div class="explorer">
<div class="ex-head">📜 CHAIN 98765 - BLOCK PROOF</div>
<div id="chainList"></div>
</div>

<script>
function getBlocks(){
  let keys=["sandeep_shield_blocks","shield_blocks","sandeepShieldData","sandeep_shield_chain"];
  for(let k of keys){
    let v=localStorage.getItem(k);
    if(v){try{let j=JSON.parse(v); if(Array.isArray(j)&&j.length>0) return j;}catch(e){}}
  }
  return [];
}
function render(){
  let blocks=getBlocks().reverse();
  document.getElementById('total').innerText=blocks.length;
  document.getElementById('c1').innerText=blocks.length;
  let html='';
  blocks.forEach((b,i)=>{
    let data=b.data||b.upi||'Sandeep ub';
    let tx=b.tx||b.txId||'TX-UPI-LIVE-B2S-98765-UP';
    let qk=b.qkey||b.qKey||'QKYB-LIVE-'+tx;
    let time=b.time||b.timestamp||new Date().toLocaleString();
    let prev=b.prev||(i==0?'GENESIS-98765':'TX-UPI-LIVE-...-98765-UP');
    let hash=b.hash||tx;
    html+=`
    <div class="block">
      <div class="b-header"><span class="b-num">BLOCK #${blocks.length-i}</span><span class="b-time">${time}</span></div>
      <div class="b-title">🔗 ${data}</div>
      <div class="b-hash">Tx: <span>${tx}</span></div>
      <div class="b-hash">QKey: <span>${qk}</span></div>
      <div class="b-hash">Prev: ${prev}</div>
      <div class="b-hash">Hash: <span>${hash}</span></div>
      <div class="verify">✅ VERIFIED - Chain 98765 | QKyB Secured</div>
    </div>
    ${i < blocks.length-1 ? '<div class="chain-line">⬇ ⛓️ ⬇</div>' : ''}
    `;
  });
  document.getElementById('chainList').innerHTML=html||'<div style="text-align:center;padding:20px;color:#94a3b8">No blocks - Scan in HOME first</div>';
}
render();
</script>
</body>
</html>
